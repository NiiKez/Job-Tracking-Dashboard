<!DOCTYPE html>
<!-- Invented posting in the structure of the classic Greenhouse board (boards.greenhouse.io): #header
     with .app-title, .company-name and .location, the text in #content, the form in #application. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application for Customer Success Manager (DACH) at Okapi Robotics</title>
</head>
<body>
  <div id="wrapper">
    <div id="main">
      <div id="app_body">
        <div id="header">
          <div class="logo-container"><a href="https://okapi-robotics.example.com"><img alt="Okapi Robotics" src="https://s3.amazonaws.com/grnhse/okapi.png"></a></div>
          <h1 class="app-title">Customer Success Manager (DACH)</h1>
          <span class="company-name">at Okapi Robotics</span>
          <div class="location">Munich, Germany</div>
        </div>
        <div id="content">
          <p>Okapi Robotics builds picking robots for mid-sized warehouses.</p>
          <p><strong>Responsibilities</strong></p>
          <ul><li>Onboard new customers in Germany, Austria and Switzerland</li><li>Run quarterly reviews</li></ul>
        </div>
        <div id="application">
          <a id="apply_button" class="button" href="#app">Apply Now</a>
          <form id="application_form"><label>First Name *</label><input id="first_name"><input type="submit" value="Submit Application"></form>
        </div>
      </div>
    </div>
  </div>
  <div id="footer"><a href="https://www.greenhouse.io/">Powered by Greenhouse</a></div>
</body>
</html>
